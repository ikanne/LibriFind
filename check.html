<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LibriFind file check</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:30px auto;padding:0 16px;line-height:1.5}
  h1{font-size:1.4rem}
  .row{border:1px solid #ccc;border-radius:10px;padding:10px 14px;margin:10px 0}
  .ok{color:#0a7a2f}.bad{color:#b00020}
  code{background:#eee;padding:1px 5px;border-radius:4px}
  img{height:60px;border-radius:6px;vertical-align:middle;margin-left:8px}
</style>
</head>
<body>
<h1>LibriFind file check</h1>
<p>This page tests which files are really on your website. Open it on your live site, wait a few seconds, then take a screenshot of the results.</p>
<div id="out"></div>

<script>
const out = document.getElementById("out");
const t = Date.now();   // avoids old cached answers

function row(html) {
  const d = document.createElement("div");
  d.className = "row";
  d.innerHTML = html;
  out.appendChild(d);
  return d;
}

async function checkCode(file, marker, hint) {
  const r = row("Checking <code>" + file + "</code>…");
  try {
    const res = await fetch(file + "?t=" + t, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const txt = await res.text();
    r.innerHTML = txt.includes(marker)
      ? `<span class="ok">✅ <code>${file}</code> is the latest version.</span>`
      : `<span class="bad">❌ <code>${file}</code> is an OLD version. ${hint}</span>`;
  } catch (e) {
    r.innerHTML = `<span class="bad">❌ <code>${file}</code> was not found (${e.message}). Upload it to the main folder.</span>`;
  }
}

function tryImg(url) {
  return new Promise(resolve => {
    const i = new Image();
    i.onload = () => resolve(true);
    i.onerror = () => resolve(false);
    i.src = url + "?t=" + t;
  });
}

async function checkImg(f) {
  const r = row("Checking <code>" + f + "</code>…");
  const names = [f, f.toLowerCase(), f.replace(/\.jpg$/i, ".JPG"), f.replace(/\.jpg$/i, ".jpeg"), f.replace(/\.jpg$/i, ".png")];
  const list = [];
  ["", "images/", "Images/"].forEach(d => names.forEach(n => { if (!list.includes(d + n)) list.push(d + n); }));
  for (const u of list) {
    if (await tryImg(u)) {
      const good = u === f;
      r.innerHTML = `<span class="${good ? "ok" : "bad"}">${good ? "✅" : "⚠️"} Found at <code>${u}</code></span><img src="${u}" alt="">` +
        (good ? "" : `<br>It should be in the main folder as <code>${f}</code>. Move or rename it.`);
      return;
    }
  }
  r.innerHTML = `<span class="bad">❌ <code>${f}</code> is NOT on your website. Upload it to the main folder.</span>`;
}

(async () => {
  await checkCode("index.html", "imgFallback", "Upload the new index.html.");
  await checkCode("script.js", "imgFallback", "Upload the new script.js.");
  await checkCode("style.css", "Images/bg.jpg", "Upload the new style.css.");
  for (const f of ["LibriFind.jpg", "library.jpg", "bg.jpg"]) await checkImg(f);
})();
</script>
</body>
</html>
